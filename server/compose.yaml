services:
  monoapp:
    image: taras0mazepa/monoapp:0.0.17
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - monoapp-data:/data
      # Lets get-practice start the solomiya reading container on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Login for pulling the private solomiya reading image from ghcr.
      - ~/.docker/config.json:/root/.docker/config.json:ro

volumes:
  monoapp-data:
