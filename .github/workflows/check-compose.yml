name: check-compose.yml

on:
  pull_request:
    paths:
      - 'server/compose.yaml'
      - '.github/workflows/check-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'server/compose.yaml'
      - '.github/workflows/check-compose.yml'
  workflow_dispatch:

jobs:
  check-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f server/compose.yaml config
      - run: docker compose -f server/compose.yaml pull
