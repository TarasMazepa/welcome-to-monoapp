name: update-compose.yml

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. 0.0.19)"
        required: false
        type: string
  repository_dispatch:
    types:
      - update-compose
      - update-monoapp-image

jobs:
  update-compose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - run: |
          VERSION="${INPUT_VERSION}"
          if [ -z "$VERSION" ]; then
            TAG=$(gh release view --repo TarasMazepa/monoapp --json tagName --jq .tagName)
            VERSION="${TAG#cli-v}"
            VERSION="${VERSION#v}"
          else
            VERSION="${VERSION#cli-v}"
            VERSION="${VERSION#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Failed to resolve version" >&2
            exit 1
          fi

          echo "Target version: $VERSION"
          sed -i -E 's|(image: taras0mazepa/monoapp:).*|\1'"$VERSION"'|' server/compose.yaml

          if git diff --quiet server/compose.yaml; then
            echo "server/compose.yaml is already up to date with version $VERSION."
            exit 0
          fi

          git config --global user.name 'monoapp'
          git config --global user.email 'monoapp@themonoapp.com'

          branch_name="update-monoapp-image-$VERSION"
          git checkout -B "$branch_name"
          git commit -am "Use monoapp $VERSION"
          git push --force --set-upstream origin "$branch_name"

          gh pr create \
            --base main \
            --head "$branch_name" \
            --title "Use monoapp $VERSION" \
            --body "Updates \`server/compose.yaml\` to use \`taras0mazepa/monoapp:$VERSION\`." \
            || echo "Pull request already exists"
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.client_payload.version }}
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
